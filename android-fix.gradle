// Adicione ao android/app/build.gradle
android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.essencial.fidelidade"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}