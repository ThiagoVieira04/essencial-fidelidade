<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Essencial" />
  <title>Essencial Fidelidade</title>

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#006400" />
  <link rel="apple-touch-icon" href="assets/icon-192x192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512x512.png" />

  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="toast.css" />
</head>
<body>
  <div id="app">
    <div class="view" id="login-view">
      <h1 style="color: var(--primary-green); margin-bottom: 15px;">Cartão Fidelidade</h1>
      <img src="assets/logo.png" alt="" class="logo" />
      <h2>Login</h2>
      <form id="login-form">
        <input type="text" placeholder="Nome" required />
        <div class="password-input-container">
          <input type="password" placeholder="Senha" required />
          <button type="button" class="password-toggle" id="toggle-login-password" aria-label="Mostrar senha">
            <span class="eye-icon">👁️</span>
          </button>
        </div>
        <button type="submit">Entrar</button>
      </form>
      <p>Não tem conta? <a href="#" id="go-to-register">Cadastre-se</a></p>
      <p><a href="admin.html" class="admin-link">Área Administrativa</a></p>
    </div>

    <div class="view" id="register-view" style="display: none;">
      <img src="assets/logo.png" alt="" class="logo" />
      <h2>Cadastro</h2>
      <form id="register-form">
        <input type="text" placeholder="Nome" required />
        <input type="tel" placeholder="Celular" required />
        <div class="password-input-container">
          <input type="password" placeholder="Senha" required />
          <button type="button" class="password-toggle" id="toggle-register-password" aria-label="Mostrar senha">
            <span class="eye-icon">👁️</span>
          </button>
        </div>
        <button type="submit">Cadastrar</button>
      </form>
      <p>Já tem conta? <a href="#" id="go-to-login">Entrar</a></p>
    </div>

    <div class="view" id="card-view" style="display: none;">
      <div class="card-header">
        <h1>Cartão Fidelidade</h1>
        <button id="logout-button">Sair</button>
      </div>
      <img src="assets/logo.png" alt="" class="logo logo-center" />
      <h2 class="user-greeting">Olá, <span id="user-name"></span></h2>
      <div class="stamp-grid" id="stamp-grid"></div>
      <div id="reward-message" class="reward-notification" style="display: none;">
        <span class="reward-text" id="reward-text">🎉 Parabéns, você ganhou um brinde!</span>
      </div>
    </div>
  </div>

  <!-- Footer com créditos do desenvolvedor -->
  <footer class="app-footer">
    <p>Desenvolvido por Papel e Sonhos Informática - WhatsApp: <a href="https://wa.me/5521987172463" target="_blank" rel="noopener noreferrer">(21) 98717-2463</a></p>
  </footer>

  <script src="config.js"></script>
  <script src="keep-alive.js"></script>
  <script src="utils.js"></script>
  <script src="theme.js"></script>
  <script src="script-supabase.js"></script>
</body>
</html>
