<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Essencial Fidelidade</title>
  
  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div id="admin-app">
    <!-- Login Admin -->
    <div class="view" id="admin-login-view">
      <header>
        <img src="assets/shirley logo (1).png" alt="Logo Essencial" class="logo" />
        <h1>Painel Administrativo</h1>
      </header>
      <form id="admin-login-form">
        <input type="text" id="admin-username" placeholder="Usuário" required />
        <input type="password" id="admin-password" placeholder="Senha" required />
        <button type="submit">Entrar</button>
      </form>
      <p><a href="index.html">← Voltar ao site</a></p>
    </div>

    <!-- Dashboard Admin -->
    <div class="view" id="admin-dashboard" style="display: none;">
      <header class="admin-header">
        <h1>Painel Administrativo</h1>
        <div class="admin-actions">
          <button id="logout-admin">Sair</button>
        </div>
      </header>

      <nav class="admin-nav">
        <button class="nav-btn active" data-section="clients">Clientes</button>
        <button class="nav-btn" data-section="stamps">Selos</button>
      </nav>

      <!-- Seção Clientes -->
      <section id="clients-section" class="admin-section">
        <div class="section-header">
          <h2>Gerenciar Clientes</h2>
          <button id="add-client-btn" class="btn-primary">+ Novo Cliente</button>
        </div>
        
        <div class="search-bar">
          <input type="text" id="client-search" placeholder="Buscar cliente..." />
        </div>

        <div id="clients-list" class="clients-grid"></div>
      </section>

      <!-- Seção Selos -->
      <section id="stamps-section" class="admin-section" style="display: none;">
        <div class="section-header">
          <h2>Gerenciar Selos</h2>
        </div>
        
        <div class="client-selector">
          <select id="client-select">
            <option value="">Selecione um cliente</option>
          </select>
        </div>

        <div id="stamps-management" style="display: none;">
          <div class="stamps-info">
            <h3 id="selected-client-name"></h3>
            <p>Selos: <span id="stamps-count">0</span>/10</p>
          </div>
          
          <div class="stamps-actions">
            <button id="add-stamp" class="btn-success">+ Adicionar Selo</button>
            <button id="remove-stamp" class="btn-danger">- Remover Selo</button>
            <button id="reset-stamps" class="btn-warning">Resetar Cartão</button>
          </div>

          <div id="stamps-grid" class="stamps-display"></div>
        </div>
      </section>
    </div>

    <!-- Modal Cadastro/Edição Cliente -->
    <div id="client-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title">Novo Cliente</h3>
          <span class="close">&times;</span>
        </div>
        <form id="client-form">
          <input type="hidden" id="client-id" />
          <div class="form-group">
            <label for="client-name">Nome *</label>
            <input type="text" id="client-name" required />
          </div>
          <div class="form-group">
            <label for="client-email">E-mail</label>
            <input type="email" id="client-email" />
          </div>
          <div class="form-group">
            <label for="client-phone">Telefone *</label>
            <input type="tel" id="client-phone" required />
          </div>
          <div class="form-group">
            <label for="client-password">Senha *</label>
            <div class="password-input-container">
              <input type="password" id="client-password" required />
              <button type="button" class="password-toggle" id="toggle-password">
                <span class="eye-icon">👁️</span>
              </button>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-client">Cancelar</button>
            <button type="submit" class="btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin-supabase.js"></script>
</body>
</html>
